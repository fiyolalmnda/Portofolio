<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddd6fe" /> <!-- soft violet-200 -->
      <stop offset="100%" stop-color="#c084fc" /> <!-- soft purple-400 -->
    </linearGradient>
    
    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <!-- Face Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>

    <!-- Clothes Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" /> <!-- violet-600 -->
      <stop offset="100%" stop-color="#a78bfa" /> <!-- violet-400 -->
    </linearGradient>
    
    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7c3aed" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Circle with glow -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" filter="url(#softGlow)" />

  <!-- Shadow behind hair/body -->
  <path d="M 100 135 L 85 170 L 115 170 Z" fill="#701a75" opacity="0.15" />

  <!-- Neck -->
  <rect x="88" y="115" width="24" height="28" rx="8" fill="url(#skinGrad)" />

  <!-- Shoulders / Clothes -->
  <path d="M 45 155 C 45 138, 70 135, 100 135 C 130 135, 155 138, 155 155 C 155 175, 145 190, 100 190 C 55 190, 45 175, 45 155 Z" fill="url(#shirtGrad)" />
  
  <!-- Collar V-Neck -->
  <path d="M 88 135 L 100 148 L 112 135 Z" fill="url(#skinGrad)" />
  
  <!-- Back Hair -->
  <path d="M 62 75 C 55 105, 62 135, 65 140 C 68 145, 75 145, 75 130 C 75 110, 78 80, 78 70 Z" fill="url(#hairGrad)" />
  <path d="M 138 75 C 145 105, 138 135, 135 140 C 132 145, 125 145, 125 130 C 125 110, 122 80, 122 70 Z" fill="url(#hairGrad)" />

  <!-- Face Shape -->
  <path d="M 68 85 C 68 62, 132 62, 132 85 C 132 108, 122 122, 100 122 C 78 122, 68 108, 68 85 Z" fill="url(#skinGrad)" />

  <!-- Hair - Bangs & Top -->
  <path d="M 100 45 C 65 45, 62 70, 62 85 C 62 90, 70 85, 75 80 C 80 75, 90 75, 95 82 C 98 86, 102 86, 105 82 C 110 75, 120 75, 125 80 C 130 85, 138 90, 138 85 C 138 70, 135 45, 100 45 Z" fill="url(#hairGrad)" />

  <!-- Glasses (Soft Purple Aesthetic) -->
  <!-- Left Glass frame -->
  <circle cx="85" cy="88" r="14" fill="none" stroke="#4c1d95" stroke-width="3.5" />
  <!-- Right Glass frame -->
  <circle cx="115" cy="88" r="14" fill="none" stroke="#4c1d95" stroke-width="3.5" />
  <!-- Bridge -->
  <path d="M 99 88 L 101 88" stroke="#4c1d95" stroke-width="3.5" stroke-linecap="round" />
  <!-- Frame Sides -->
  <path d="M 71 88 L 68 88" stroke="#4c1d95" stroke-width="3" stroke-linecap="round" />
  <path d="M 129 88 L 132 88" stroke="#4c1d95" stroke-width="3" stroke-linecap="round" />

  <!-- Eyes behind glasses -->
  <circle cx="85" cy="88" r="3.5" fill="#2e1065" />
  <circle cx="115" cy="88" r="3.5" fill="#2e1065" />

  <!-- Cheeks (Blush) -->
  <circle cx="75" cy="98" r="6" fill="#f43f5e" opacity="0.25" />
  <circle cx="125" cy="98" r="6" fill="#f43f5e" opacity="0.25" />

  <!-- Smile -->
  <path d="M 94 105 C 97 109, 103 109, 106 105" stroke="#4c1d95" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Stylized Laptop at the bottom (cropped) -->
  <path d="M 60 180 L 140 180 L 150 200 L 50 200 Z" fill="#f5f3ff" opacity="0.9" />
  <path d="M 70 182 L 130 182" stroke="#ddd6fe" stroke-width="2" stroke-linecap="round" />
</svg>
